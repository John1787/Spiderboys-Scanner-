[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderboys-trading-pro"
version = "6.2.0"
description = "Streamlit-first momentum trading workstation with scanner, risk controls, TradingView tools, and journal analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35,<2",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
webhook = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
